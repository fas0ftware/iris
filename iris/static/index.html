<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Iris</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true">◐</span> Iris <small id="ver"></small></h1>
  <p id="stats" class="muted"></p>
</header>
<main>
  <section id="tasks-box" hidden>
    <h2>To do <small id="tasks-count" class="muted"></small></h2>
    <ol id="tasks" aria-live="polite"></ol>
    <details id="tasks-other-box" hidden><summary class="muted" id="tasks-other-sum"></summary><ol id="tasks-other"></ol></details>
  </section>
  <h2>Inbox</h2>
  <nav id="topics" aria-label="Topics"></nav>
  <ol id="inbox" aria-live="polite"></ol>
</main>
<footer class="muted">Messages from your tools, kept 90 days on this computer. Refreshes every 10 s.</footer>
</body>
</html>
