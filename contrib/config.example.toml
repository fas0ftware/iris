# ~/.config/iris/config.toml (every key is optional)

[deliver]
ntfy = ""            # e.g. "https://ntfy.sh/a-long-random-topic"; "" = no phone
desktop = true       # notify-send on this computer

[quiet]
hours = "23-07"      # at night only messages at or above `pass` go out
pass = "high"

[dedup]
minutes = 30         # the same title and text within 30 minutes is counted, not sent again

[digest]
at = "08:00"         # one summary of what was held back at night

# [topics.mnemosyne]
# min = "default"    # "low" backup messages are stored, never delivered

# Rules: the first one whose topic and text match decides (text: case-insensitive, title or body).
# action: "store" (keep, never deliver), "hold" (for the morning digest), "always" (deliver now,
# even at night); priority (optional) changes the message's priority first.
# [[rules]]
# match = "failed"
# action = "always"
#
# [[rules]]
# topic = "hestia"
# match = "recovered"
# action = "hold"

[tasks]
lang = "en"          # language of task messages: "en" or "tr"
plan_at = "08:30"    # today's plan (every open task) once a day; "" = never
