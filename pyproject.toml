[project]
name = "iris"
version = "0.1.0"
description = "One inbox for the notifications of your home tools: ntfy-compatible, dedup, quiet hours, a morning digest"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iris = "iris.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iris"]

[tool.setuptools.package-data]
iris = ["static/*"]
